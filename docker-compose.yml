services:
  postgres:
    image: postgres:17
    container_name: secure-sql-agent-db
    environment:
      POSTGRES_DB: sqlagent
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sqlagent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
